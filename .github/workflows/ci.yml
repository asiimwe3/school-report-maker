name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop-admin:
    name: Desktop admin (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run core calculation tests
        run: gradle :core:test
      - name: Build desktop app
        run: gradle :desktop-admin:build
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: desktop-admin-jar
          path: desktop-admin/build/libs/*.jar

  teacher-android:
    name: Teacher app (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle :teacher-app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teacher-app-debug-apk
          path: teacher-app/build/outputs/apk/debug/*.apk

  desktop-installer-windows:
    name: Windows installer (MSI, with desktop icon)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Package MSI installer
        run: gradle :desktop-admin:packageMsi
        shell: bash
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: school-report-maker-windows-msi
          path: desktop-admin/build/compose/binaries/main/msi/*.msi
